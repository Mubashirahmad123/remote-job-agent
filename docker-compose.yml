services:
  # 24/7 background scheduler (Mondays & Thursdays at 9:00 AM)
  scheduler:
    build: .
    container_name: job-agent-scheduler
    restart: unless-stopped
    command: ["python", "scheduler.py"]
    env_file:
      - .env
    environment:
      - PLAYWRIGHT_HEADLESS=true
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      # .env as a file: main.py/Run.py exit(1) when /app/.env is missing —
      # env_file alone only injects vars, it does not create the file.
      - ./.env:/app/.env:ro
      - ./keys.json:/app/keys.json:ro
      - ./my_cv.pdf:/app/my_cv.pdf:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./seen_jobs.json:/app/seen_jobs.json
      - ./scraped_jobs.json:/app/scraped_jobs.json
      - ./curated_jobs.json:/app/curated_jobs.json
      - ./apply_packages:/app/apply_packages
      - ./resumes:/app/resumes
      - ./cover_letters:/app/cover_letters
      - ./screenshots:/app/screenshots

  # On-demand runner for CLI commands (e.g. simple scrape, apply, resume, tests)
  runner:
    build: .
    container_name: job-agent-runner
    profiles: ["cli"]
    command: ["python", "main.py", "crewai"]
    env_file:
      - .env
    environment:
      - PLAYWRIGHT_HEADLESS=true
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      # Same reason as scheduler: main.py requires the .env file on disk.
      - ./.env:/app/.env:ro
      - ./keys.json:/app/keys.json:ro
      - ./my_cv.pdf:/app/my_cv.pdf:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./seen_jobs.json:/app/seen_jobs.json
      - ./scraped_jobs.json:/app/scraped_jobs.json
      - ./curated_jobs.json:/app/curated_jobs.json
      - ./apply_packages:/app/apply_packages
      - ./resumes:/app/resumes
      - ./cover_letters:/app/cover_letters
      - ./screenshots:/app/screenshots

  # FastAPI backend + same-origin Command Center dashboard.
  # Binds 0.0.0.0 inside the container; public traffic reaches it only through
  # Caddy. API_TOKEN must be set in .env or api/app.py refuses the non-local bind.
  api:
    build: .
    container_name: job-agent-api
    restart: unless-stopped
    command: [
      "python", "-m", "uvicorn", "api.app:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      # MUST stay at 1: api/ratelimit.py is per-process, so N workers would
      # give an attacker N x the login budget. Move the limiter to a shared
      # store (Redis) before scaling this up.
      "--workers", "1",
      # Caddy terminates TLS and forwards X-Forwarded-{For,Proto}. Without
      # these, request.client.host is always Caddy's container IP (so login
      # rate limiting would key on one shared bucket for every user) and
      # request.url.scheme is always http (so the session cookie's Secure flag
      # would silently depend on SESSION_COOKIE_SECURE=true below).
      # Trusting "*" is safe ONLY because api:8000 is reachable from the docker
      # network (Caddy) and 127.0.0.1 on the host — never from the public
      # internet directly. If you ever publish this port, narrow it to Caddy's
      # container IP.
      "--proxy-headers",
      "--forwarded-allow-ips", "*",
    ]
    env_file:
      - .env
    environment:
      - PLAYWRIGHT_HEADLESS=true
      - TZ=${TZ:-Asia/Kolkata}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Caddy terminates TLS in front of the api container, so the session
      # cookie must carry Secure via env (the api itself sees plain HTTP).
      - SESSION_COOKIE_SECURE=true
    ports:
      # Localhost-only escape hatch (SSH tunnel); public access is via Caddy.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./keys.json:/app/keys.json:ro
      - ./my_cv.pdf:/app/my_cv.pdf:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./seen_jobs.json:/app/seen_jobs.json
      - ./scraped_jobs.json:/app/scraped_jobs.json
      - ./curated_jobs.json:/app/curated_jobs.json
      - ./apply_packages:/app/apply_packages
      - ./resumes:/app/resumes
      - ./cover_letters:/app/cover_letters
      - ./screenshots:/app/screenshots

  # HTTPS reverse proxy with automatic Let's Encrypt certs.
  # SITE_ADDRESS=:80 serves plain HTTP (fine for a bare IP); set it to a real
  # hostname (e.g. jobs.example.com) for automatic HTTPS + HTTP->HTTPS redirect.
  caddy:
    image: caddy:2-alpine
    container_name: job-agent-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
